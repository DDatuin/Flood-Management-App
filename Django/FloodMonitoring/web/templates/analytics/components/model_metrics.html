<div class="analytics-card">

    <div class="analytics-card-header">

        <div>
            <h2 class="analytics-title">MODEL METRICS</h2>

            <p class="analytics-subtitle">
                Performance evaluation of the flood forecasting model per sensor location, with regression trends for the last 24-hrs and confusion matrix summary for each classification.
            </p>
        </div>

        <div class="analytics-tabs">

            <button
                id="regression-tab"
                class="analytics-tab analytics-tab-active">

                Regression

            </button>

            <button
                id="classification-tab"
                class="analytics-tab">

                Classification

            </button>

        </div>

    </div>

    <div class="analytics-card-body">

        <div id="regression-panel" class="analytics-panel active">

            <div class="metrics-summary">

                <div class="metric-card">
                    <span class="metric-label">RMSE</span>
                    <span id="rmse-val" class="metric-value">0.124</span>
                </div>

                <div class="metric-card">
                    <span class="metric-label">MAE</span>
                    <span id="mae-val" class="metric-value">0.083</span>
                </div>

                <div class="metric-card">
                    <span class="metric-label">MSE</span>
                    <span id="mse-val" class="metric-value">0.015</span>
                </div>

            </div>

            <div class="metrics-chart">

                <canvas id="regression-chart"></canvas>

            </div>

        </div>

        <div id="classification-panel" class="analytics-panel">

            <div class="metrics-toolbar">

                <label class="analytics-dropdown-label">
                    Classification Type
                </label>

                <select id="classification-type-dropdown"
                        class="analytics-dropdown">

                    <option value="mmda">MMDA Flood Category</option>
                    <option value="pedestrian">Pedestrian</option>
                    <option value="bicycle">Bicycle</option>
                    <option value="motorcycle">Motorcycle</option>
                    <option value="car">Car</option>
                    <option value="truck">Truck</option>

                </select>

            </div>

            <div class="confusion-matrix-container">

                <table id="confusion-matrix-table"
                    class="confusion-matrix-table">
                </table>

            </div>

        </div>

    </div>

</div>
