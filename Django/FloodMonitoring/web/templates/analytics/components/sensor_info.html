<div class="analytics-card">

    <div class="analytics-card-header">
        <div>
            <h2 class="analytics-title">SENSOR INFORMATION</h2>
            <p class="analytics-subtitle">
                Identification, location, and deployment details of the selected sensor.
            </p>
        </div>
    </div>

    <div class="analytics-card-body">

        <div class="sensor-info-list">

            <div class="sensor-info-item">
                <span class="sensor-info-label">Sensor ID</span>
                <span id="sensor-id" class="sensor-info-value">
                    SENS-001
                </span>
            </div>

            <div class="sensor-info-item">
                <span class="sensor-info-label">Location</span>
                <span id="sensor-location" class="sensor-info-value">
                    Anonas St. / Road 9 Intersection
                </span>
            </div>

            <div class="sensor-info-item">
                <span class="sensor-info-label">Coordinates</span>
                <span id="sensor-coordinates" class="sensor-info-value">
                    14.6000103311735, 121.00910391615
                </span>
            </div>

            <div class="sensor-info-item">
                <span class="sensor-info-label">Status</span>

                <span
                    id="sensor-info-status"
                    class="sensor-activity-status online">

                    <span class="sensor-activity-dot"></span>

                    <span class="sensor-activity-text">
                        Online
                    </span>

                </span>
            </div>

            <div class="sensor-info-item">
                <span class="sensor-info-label">Ground Distance</span>
                <span id="sensor-ground-distance" class="sensor-info-value">
                    279.4 cm
                </span>
            </div>

            <div class="sensor-info-item">
                <span class="sensor-info-label">Monitoring Radius</span>
                <span id="sensor-radius" class="sensor-info-value">
                    10 m
                </span>
            </div>

        </div>

    </div>

</div>
