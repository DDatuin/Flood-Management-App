<div class="analytics-card">
    <div class="analytics-card-header">
        <div>
            <h2 class="analytics-title">
                OVERALL ANALYTICS
            </h2>

            <p class="analytics-subtitle">
                Summary of all monitored sensors and overall model performance.
            </p>
        </div>
    </div>

    <div class="analytics-card-body">

        <!-- Sensor Summary -->
        <div class="overall-metrics-row sensors">

            <div class="metric-card">
                <span class="metric-label">Total Sensors</span>
                <span class="metric-value">12</span>
            </div>

            <div class="metric-card">
                <span class="metric-label">Active Sensors</span>
                <span class="metric-value">10</span>
            </div>

            <div class="metric-card">
                <span class="metric-label">Offline Sensors</span>
                <span class="metric-value">2</span>
            </div>

        </div>

        <!-- Model Metrics -->
        <div class="overall-metrics-row model">

            <div class="metric-card">
                <span class="metric-label">RMSE</span>
                <span class="metric-value">0.124</span>
            </div>

            <div class="metric-card">
                <span class="metric-label">MSE</span>
                <span class="metric-value">0.015</span>
            </div>

            <div class="metric-card">
                <span class="metric-label">MAE</span>
                <span class="metric-value">0.083</span>
            </div>

            <div class="metric-card">
                <span class="metric-label">R² Score</span>
                <span class="metric-value">0.972</span>
            </div>

        </div>

    </div>
</div>
