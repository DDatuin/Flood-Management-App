<div class="analytics-card">

<div class="analytics-card-header">
    <div>
        <h2 class="analytics-title">WEATHER INFORMATION</h2>
        <p class="analytics-subtitle">
            Current weather conditions retrieved from OpenWeather.
        </p>
    </div>
</div>

<div class="analytics-card-body">

    <div class="weather-info-list">

        <div class="weather-info-item">
            <span class="weather-info-label">Temperature</span>
            <span id="weather-temperature" class="weather-info-value">
                30.4 °C
            </span>
        </div>

        <div class="weather-info-item">
            <span class="weather-info-label">Condition</span>

            <span id="weather-description" class="weather-condition">
                Light Rain
            </span>
        </div>

        <div class="weather-info-item">
            <span class="weather-info-label">Pressure</span>
            <span id="weather-pressure" class="weather-info-value">
                1008 hPa
            </span>
        </div>

    </div>

</div>

</div>
